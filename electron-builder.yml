# electron-builder configuration for vibeCheck.
#
# Run from this package root (the npm workspace root): the packaged "main"
# entry resolves packages/desktop/dist and packages/backend/dist relative to
# here, and production dependencies are hoisted into the root node_modules.
#
# Prerequisites:
#   npm ci                 # populate the hoisted node_modules
# The package scripts compile first, so run one of:
#   npm run package        # macOS and Windows together
#   npm run package:mac    # dmg + zip, arm64 and x64
#   npm run package:win    # nsis installer, x64

appId: io.github.shiboo18.vibecheck
productName: vibeCheck

directories:
  output: build/electron
  buildResources: build-resources

# Never let electron-builder run its own public-registry install or rebuild;
# dependencies come from the internal registry and there are no native modules.
npmRebuild: false

asar: true

# Electron fuses, flipped in the packaged binary. Addresses and Smarty credentials
# are only as private as the process that reads them, so the ways of turning it into
# a general-purpose Node runtime are closed. resetAdHocDarwinSignature is required
# because flipping a fuse invalidates the unsigned macOS build's signature.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true

# Explicit allowlist: only compiled output and the package manifests, not the
# whole monorepo. electron-builder adds the production dependencies hoisted to
# the root node_modules.
files:
  - "package.json"
  - "packages/desktop/dist/**/*"
  - "packages/desktop/package.json"
  - "packages/backend/dist/**/*"
  - "packages/backend/package.json"
  - "!**/*.map"

artifactName: "vibeCheck-${version}-${arch}.${ext}"

# The release workflow publishes the installers; electron-builder must not
# upload them itself when it sees a tag in CI.
publish: null

mac:
  # Unsigned by default: no certificate or notarization, so Gatekeeper warns on
  # first launch. Signing needs a Developer ID (or internal) identity plus the
  # hardenedRuntime/notarize settings; do not set placeholder values here.
  identity: null
  category: public.app-category.productivity
  icon: build-resources/icon.icns
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

win:
  # Unsigned by default so cross-builds from macOS are deterministic; unsigned
  # installers trigger SmartScreen warnings. Signing needs CSC_LINK /
  # CSC_KEY_PASSWORD.
  signAndEditExecutable: false
  icon: build-resources/icon.ico
  # One installer carrying both architectures; Windows has no universal binary,
  # so NSIS picks the right build at install time.
  artifactName: "vibeCheck-${version}-setup.${ext}"
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "vibeCheck-${version}-${arch}-setup.${ext}"
