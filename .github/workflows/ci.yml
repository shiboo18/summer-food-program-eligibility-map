name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck:tests

      # Electron needs a display even in smoke-test mode, which never shows a
      # window; xvfb provides a virtual one.
      - name: Smoke test
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron . --smoke-test --no-sandbox
